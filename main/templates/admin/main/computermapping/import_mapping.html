{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <p>
        Загрузка файла с колонками <strong>IP</strong> и <strong>Номер</strong>.
        Повторная загрузка запрещена (удалите текущие записи для обновления).
    </p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset class="module aligned">
            <div class="form-row">
                <label for="id_file">XLSX-файл:</label>
                <input type="file" name="file" id="id_file" required accept=".xlsx">
            </div>
        </fieldset>
        <div class="submit-row">
            <input type="submit" value="Загрузить" class="default">
            <a href="{% url 'admin:main_computermapping_changelist' %}" class="button cancel-link">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
