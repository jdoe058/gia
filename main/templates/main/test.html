{% extends "main/base.html" %}
{% block title %}Тест — ГИА{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 text-muted">Вопрос {{ position }} из {{ total }}</h4>
            <h5 class="mb-0 text-danger">Осталось: <strong id="timer">--:--</strong></h5>
        </div>

        <div class="card shadow-sm mb-4 bg-light">
            <div class="card-body p-4">
                <h4 class="card-title mb-0">{{ question.text }}</h4>
            </div>
        </div>

        <form method="post" action="{% url 'answer' session.id %}">
            {% csrf_token %}
            <input type="hidden" name="question_id" value="{{ question.id }}">

            <div class="list-group mb-4 shadow-sm">
                {% for answer in answers %}
                    <label class="list-group-item d-flex gap-3 py-3 align-items-center">
                        <input class="form-check-input flex-shrink-0" type="radio" name="answer_id" value="{{ answer.id }}" required style="font-size: 1.5rem; margin-top: 0;">
                        <span class="fs-5">{{ answer.text }}</span>
                    </label>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Ответить и продолжить</button>
        </form>
        
        <p class="text-center text-muted small mt-4">Вернуться к предыдущим вопросам нельзя.</p>
    </div>
</div>

<script>
    // Таймер (JS остался без изменений, так как логика не зависит от CSS)
    (function () {
        const deadline = new Date("{{ deadline_iso }}").getTime();
        const resultUrl = "{% url 'test_result' session.id %}";
        const timerEl = document.getElementById('timer');

        function tick() {
            const diff = deadline - Date.now();
            if (diff <= 0) {
                timerEl.textContent = '00:00';
                window.location.href = resultUrl;
                return;
            }
            const totalSec = Math.floor(diff / 1000);
            const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            timerEl.textContent = m + ':' + s;
        }

        tick();
        setInterval(tick, 1000);
    })();
</script>
{% endblock %}
